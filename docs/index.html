<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flava 文档</title>
    <!-- 只加载自定义样式，不加载 docsify 外部主题（避免样式冲突） -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ========== 顶部导航栏 ========== -->
    <nav class="top-navbar">
        <div class="menu-icon" id="menuIcon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-text">Flava Docs</div>
    </nav>

    <!-- ========== 侧边栏 ========== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="https://flava.woen.pics" class="back-button" id="homeBtn">← 返回主页</a>
        </div>
        <div class="sidebar-body">
            <div class="tree-title">文档列表</div>
            <ul class="tree-list" id="sidebarTree">
                <li class="tree-item" data-route="README">
                    <span>首页</span>
                </li>
                <li class="tree-item has-children close">
                    <span class="tree-label">拓展系统</span>
                    <ul class="tree-children">
                        <span class="tree-label">1.0</span>
                        <ul class="tree-children">
                            <li class="tree-item" data-route="extra/1d0/filestructure.md">
                                <span>文件结构</span>
                            </li>
                            <li class="tree-item" data-route="extra/1d0/api.md">
                                <span>lua端api</span>
                            </li>
                            <li class="tree-item" data-route="extra/1d0/keys.md">
                                <span>键盘api数字对照表</span>
                            </li>
                            <li class="tree-item" data-route="extra/1d0/uifile.md">
                                <span>.ui文件</span>
                            </li>
                            <li class="tree-item" data-route="extra/1d0/process.md">
                                <span>flava拓展加载机制</span>
                            </li>
                        </ul>
                    </ul>
                </li>
            </ul>
        </div>
    </aside>

    <!-- ========== 背景画布 ========== -->
    <canvas id="gridCanvas" class="grid-canvas"></canvas>
    <canvas id="fireCanvas" class="fire-canvas"></canvas>

    <!--
        ========== 半透明白色圆角矩形背景 ==========
        与 .content-wrapper 同级，都直接挂在 body 下，
        都用 position: fixed 钉在视口上。
        .content-bg 比 .content-wrapper 各边外扩 5px，
        这样文字离白色矩形边缘就有 5px 间距。
    -->
    <div class="content-bg" id="contentBg"></div>

    <!-- ========== 文档内容区（docsify 挂载点） ========== -->
    <main class="content-wrapper" id="contentWrapper">
        <div id="app"></div>
    </main>

    <!-- ========== 脚本 ========== -->
    <script src="bg-animation.js"></script>
    <script>
        window.$docsify = {
            name: 'Flava 文档',
            repo: '',
            homepage: 'README.md',
            loadSidebar: false,
            loadNavbar: false,
            subMaxLevel: 3,
            maxLevel: 4,
            auto2top: false,
            search: {
                placeholder: '🔍 搜索文档',
                noData: '未找到结果'
            },
            plugins: [
                function (hook, vm) {
                    hook.doneEach(function () {
                        if (window.__resizeCanvas) window.__resizeCanvas();
                        if (window.__syncSidebar) window.__syncSidebar();
                        if (window.__onRouteChange) window.__onRouteChange();
                    });
                }
            ]
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/plugins/search.min.js"></script>
</body>
</html>
