<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flava 文档</title>
    <!-- docsify 主题样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/themes/vue.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ========== 顶部导航栏 ========== -->
    <nav class="top-navbar">
        <div class="menu-icon" id="menuIcon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-text">Flava Docs</div>
    </nav>

    <!-- ========== 侧边栏（自定义，docsify 不接管） ========== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="https://flava.woen.pics" class="back-button" id="homeBtn">← 返回主页</a>
        </div>
        <div class="sidebar-body">
            <div class="tree-title">文档列表</div>
            <ul class="tree-list" id="sidebarTree">
                <li class="tree-item" data-route="README">
                    <span>🏠 首页</span>
                </li>
                <li class="tree-item has-children open">
                    <span class="tree-label">📁 项目文档</span>
                    <ul class="tree-children">
                        <li class="tree-item" data-route="project/intro">
                            <span>项目介绍</span>
                        </li>
                        <li class="tree-item" data-route="project/design">
                            <span>设计文档</span>
                        </li>
                        <li class="tree-item" data-route="project/test">
                            <span>测试用例</span>
                        </li>
                    </ul>
                </li>
                <li class="tree-item has-children open">
                    <span class="tree-label">🔧 技术文档</span>
                    <ul class="tree-children">
                        <li class="tree-item" data-route="tech/api">
                            <span>API 文档</span>
                        </li>
                        <li class="tree-item" data-route="tech/deploy">
                            <span>部署指南</span>
                        </li>
                    </ul>
                </li>
                <li class="tree-item" data-route="meeting">
                    <span>📝 会议记录</span>
                </li>
                <li class="tree-item" data-route="guide">
                    <span>📖 用户手册</span>
                </li>
            </ul>
        </div>
    </aside>

    <!-- ========== 背景画布（来自主站） ========== -->
    <canvas id="gridCanvas" class="grid-canvas"></canvas>
    <canvas id="fireCanvas" class="fire-canvas"></canvas>

    <!--
        ============================================================
        关键布局说明：
        .content-bg 和 .content-wrapper 是 BODY 的直接子元素，
        两者都用 position: fixed 钉在视口上，互不嵌套。
        这样 .content-bg 的高度 = 视口高度（永远铺满），
        不受文档内容长短影响，文字永远不会超出背景。
        ============================================================
    -->

    <!-- 半透明白色圆角矩形背景（fixed 钉视口，永远铺满可视区） -->
    <div class="content-bg" id="contentBg"></div>

    <!-- 文档内容区（fixed 钉视口，内部滚动） -->
    <main class="content-wrapper" id="contentWrapper">
        <!-- docsify 挂载点 -->
        <div id="app"></div>
    </main>

    <!-- ========== 脚本 ========== -->
    <!-- 先加载 bg-animation.js，确保全局函数在 docsify 插件调用前就位 -->
    <script src="bg-animation.js"></script>
    <script>
        // docsify 配置 —— 关闭自带侧边栏，由我们自定义
        window.$docsify = {
            name: 'Flava 文档',
            repo: '',
            homepage: 'README.md',
            loadSidebar: false,
            loadNavbar: false,
            subMaxLevel: 3,
            maxLevel: 4,
            auto2top: false,          // 关闭！window 不滚动，由 bg-animation 控制 contentWrapper.scrollTop
            search: {
                placeholder: '🔍 搜索文档',
                noData: '未找到结果'
            },
            plugins: [
                function (hook, vm) {
                    hook.doneEach(function () {
                        // 路由切换后重绘背景
                        if (window.__resizeCanvas) {
                            window.__resizeCanvas();
                        }
                        // 同步侧边栏高亮
                        if (window.__syncSidebar) {
                            window.__syncSidebar();
                        }
                        // 路由切换后复位滚动位置 + 清空搜索框
                        if (window.__onRouteChange) {
                            window.__onRouteChange();
                        }
                    });
                }
            ]
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/docsify.min.js"></script>
    <!-- 搜索插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/plugins/search.min.js"></script>
</body>
</html>
