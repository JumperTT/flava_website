<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flava Download</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ========== 顶部导航栏 ========== -->
    <nav class="top-navbar">
        <div class="nav-text">Flava Download</div>
    </nav>

    <!-- ========== 背景画布 ========== -->
    <canvas id="gridCanvas" class="grid-canvas"></canvas>
    <canvas id="fireCanvas" class="fire-canvas"></canvas>

    <!-- ========== 半透明白色圆角矩形背景 ========== -->
    <div class="content-bg" id="contentBg"></div>

    <!-- ========== 主内容区 ========== -->
    <main class="content-wrapper" id="contentWrapper">
        <div id="app">
            <!-- 页面标题 -->
            <h1 class="page-title">Flava Download</h1>

            <!-- 主程序下载 -->
            <div class="download-section">
                <div class="download-section-title">⚡最新版</div>
                <div class="download-card">
                    <div class="download-info">
                        <div class="download-icon">⚙️</div>
                        <div class="download-text">
                            <span class="download-name">flava v1.0</span>
                            <span class="download-meta">7.51MB</span>
                        </div>
                    </div>
                    <a class="download-btn" href="#" id="openDownloadDialog">下载</a>
                </div>
                <div class="download-section-title">📄历史版本</div>
            </div>

            <!-- 提示 -->
            <div class="notice-box">
                <strong>提示：</strong>下载可能被各种软件拦截。下载如果失败，请到文档处查询下载方法
            </div>

            <!-- 返回主页 -->
            <a href="https://flava.woen.pics" class="back-home" id="backHomeBtn">← 返回主页</a>
        </div>
    </main>

    <!-- ========== 下载弹窗 ========== -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog-box">
            <button class="dialog-close" id="dialogClose">✕</button>
            <div class="dialog-title">多方式下载</div>
            <div class="dialog-desc">由于下载可能被各种方式拦截，这里准备了多种方式下载</div>

            <!-- 方式1：直接下载 -->
            <div class="method-block">
                <div class="method-title">1. 直接下载</div>
                <button class="method-btn" id="btnDirectDownload">点击下载</button>
            </div>

            <!-- 方式2：直接写入文件 -->
            <div class="method-block">
                <div class="method-title">2. 直接写入文件</div>
                <div class="method-row">
                    <button class="method-btn" id="btnPickDir">选择位置</button>
                    <button class="method-btn" id="btnWriteFile">开始下载</button>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">等待操作...</div>
            </div>

            <!-- 方式3：base64复制解码 -->
            <div class="method-block">
                <div class="method-title">3. base64 复制解码</div>
                <button class="method-btn" id="btnEncodeCopy">开始获取并编码</button>
                <div class="textarea-wrapper">
                    <textarea class="method-textarea" id="base64CopyText" readonly placeholder="base64 编码内容将显示在这里..."></textarea>
                    <button class="method-btn copy-btn" id="btnCopyBase64">复制</button>
                </div>
                <a href="https://www.baidu.com" target="_blank" class="tutorial-link">不会使用？点击查看教程</a>
            </div>

            <!-- 方式4：base64拖拽解码 -->
            <div class="method-block">
                <div class="method-title">4. base64 拖拽解码</div>
                <button class="method-btn" id="btnEncodeDrag">开始获取并编码</button>
                <div class="textarea-wrapper">
                    <textarea class="method-textarea" id="base64DragText" placeholder="base64 编码内容将显示在这里（可框选拖拽）..."></textarea>
                </div>
                <a href="https://www.baidu.com" target="_blank" class="tutorial-link">不会使用？点击查看教程</a>
            </div>
        </div>
    </div>

    <!-- ========== 脚本 ========== -->
    <script src="bg-animation.js"></script>
    <script src="download-dialog.js"></script>
</body>
</html>
