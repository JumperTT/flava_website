<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flava Download</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ========== 顶部导航栏 ========== -->
    <nav class="top-navbar">
        <div class="nav-text">Flava Download</div>
    </nav>

    <!-- ========== 背景画布 ========== -->
    <canvas id="gridCanvas" class="grid-canvas"></canvas>
    <canvas id="fireCanvas" class="fire-canvas"></canvas>

    <!-- ========== 半透明白色圆角矩形背景 ========== -->
    <div class="content-bg" id="contentBg"></div>

    <!-- ========== 主内容区 ========== -->
    <main class="content-wrapper" id="contentWrapper">
        <div id="app">
            <!-- 页面标题 -->
            <h1 class="page-title">Flava Download</h1>

            <!-- 主程序下载 -->
            <div class="download-section">
                <div class="download-section-title">⚡ 最新版</div>

                <!-- v1.0  -->
                <div class="download-card">
                    <div class="download-info">
                        <div class="download-icon">⚙️</div>
                        <div class="download-text">
                            <span class="download-name">Flava v1.0</span>
                            <span class="download-meta">第一个版本</span>
                        </div>
                    </div>
                    <button class="download-btn" data-version="1.0" data-file="flava1.0.exe" data-size="7.52MB">下载</button>
                </div>

                <div class="download-section-title">📄 历史版本</div>
            <!-- 提示 -->
            <div class="notice-box">
                <strong>提示：</strong>下载可能被各种软件拦截。如果下载失败，请查看文档
            </div>

            <!-- 返回主页 -->
            <a href="https://flava.woen.pics" class="back-home" id="backHomeBtn">← 返回主页</a>
        </div>
    </main>

    <!-- ========== 下载弹窗 ========== -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog-box">
            <button class="dialog-close" id="dialogClose">✕</button>
            <h2 class="dialog-title" id="dialogTitle">下载</h2>
            <p class="dialog-desc" id="dialogDesc">由于下载可能被各种方式拦截，这里准备了多种方式下载</p>

            <!-- 方式1：直接下载 -->
            <div class="dlg-section">
                <div class="dlg-section-title">1. 直接下载</div>
                <button class="dlg-btn" id="btnDirectDownload">点击下载</button>
            </div>

            <!-- 方式2：写入文件 -->
            <div class="dlg-section">
                <div class="dlg-section-title">2. 直接写入文件</div>
                <div class="dlg-btn-row">
                    <button class="dlg-btn" id="btnPickDir">选择位置</button>
                    <button class="dlg-btn" id="btnWriteFile" disabled>开始下载</button>
                </div>
                <div class="dlg-progress-wrap">
                    <div class="dlg-progress-bar" id="progressBar"></div>
                </div>
                <div class="dlg-progress-text" id="progressText">等待操作...</div>
            </div>

            <!-- 方式3：base64 复制 -->
            <div class="dlg-section">
                <div class="dlg-section-title">3. base64 复制解码</div>
                <button class="dlg-btn" id="btnEncodeCopy">开始获取并编码</button>
                <div class="dlg-textarea-wrap">
                    <textarea class="dlg-textarea dlg-textarea-readonly" id="base64Readonly" readonly placeholder="点击上方按钮获取编码..."></textarea>
                    <button class="dlg-copy-btn" id="btnCopy">复制</button>
                </div>
                <a href="../docs/index.html#/download/download" target="_blank" class="dlg-tutorial-link">不会使用？点击查看教程</a>
            </div>

            <!-- 方式4：base64 拖拽 -->
            <div class="dlg-section">
                <div class="dlg-section-title">4. base64 拖拽解码</div>
                <button class="dlg-btn" id="btnEncodeDrag">开始获取并编码</button>
                <textarea class="dlg-textarea" id="base64Editable" placeholder="点击上方按钮获取编码..."></textarea>
                <a href="../docs/index.html#/download/download" target="_blank" class="dlg-tutorial-link">不会使用？点击查看教程</a>
            </div>
        </div>
    </div>

    <!-- ========== 脚本 ========== -->
    <script src="download-dialog.js"></script>
    <script src="bg-animation.js"></script>
</body>
</html>
